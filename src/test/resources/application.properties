spring.application.name=onboarding-service-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false

resilience4j.circuitbreaker.instances.kycService.sliding-window-size=10
resilience4j.circuitbreaker.instances.kycService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.kycService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kycService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.kycService.permitted-number-of-calls-in-half-open-state=3

